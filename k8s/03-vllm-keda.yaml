# KEDA autoscaling for vLLM. It scales the Rollout via the scale subresource.
# GPU pods are slow to start (new node + weights + model load), so:
#   - keep a warm minimum (never scale to zero on the request path)
#   - scale UP gradually: pending pods don't lower the metric, so a fast scale-up
#     overshoots to max and then thrashes on the way down
#   - scale DOWN slowly
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-llama
  namespace: inference
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: vllm-llama
  minReplicaCount: 2
  maxReplicaCount: 8            # must stay within the GPU NodePool limit (16 GPUs)
  pollingInterval: 15
  # If Prometheus is unreachable (3 failed polls), hold 2 replicas instead of
  # leaving the HPA with no metrics. Requires AverageValue triggers (see below).
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 120   # demand must persist for 2 min
          policies:
            - { type: Pods, value: 1, periodSeconds: 300 }   # one new GPU pod per 5 min
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - { type: Pods, value: 1, periodSeconds: 300 }
  triggers:
    # Waiting requests per replica. Scale out when each pod has > 4 queued.
    - type: prometheus
      name: queue-depth
      metricType: AverageValue
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: 'sum(vllm:num_requests_waiting{namespace="inference"})'
        threshold: "4"

    # KV-cache utilisation. Using sum() with AverageValue is equivalent to targeting an
    # 80% average across pods, and (unlike metricType Value) it works with `fallback`.
    - type: prometheus
      name: kv-cache
      metricType: AverageValue
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: 'sum(vllm:gpu_cache_usage_perc{namespace="inference"})'
        threshold: "0.8"

    # OPTIONAL: lower the floor outside business hours. To use it, set minReplicaCount: 1
    # above and uncomment. During the window below, KEDA keeps at least 2 replicas.
    # - type: cron
    #   metadata:
    #     timezone: Asia/Kolkata
    #     start: "0 9 * * *"
    #     end: "0 22 * * *"
    #     desiredReplicas: "2"
